<!DOCTYPE html>
<html>
<head>
  <title>Startup Idea Finder AI</title>
  <style>
    body {
      background: #0b0f19;
      color: white;
      font-family: Arial;
      padding: 40px;
    }

    .card {
      background: #131a2a;
      border-radius: 20px;
      padding: 20px;
      margin-top: 20px;
      box-shadow: 0 0 30px rgba(0,255,255,0.1);
    }

    button {
      background: cyan;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>🚀 Startup Idea Finder AI</h1>
  <p>Autonomous AI founder system.</p>

  <input id='topic' placeholder='Enter niche'/>
  <button onclick='generateIdea()'>Generate Startup</button>

  <div class='card'>
    <pre id='output'></pre>
  </div>

<script>
async function generateIdea() {
  const topic = document.getElementById('topic').value;

  document.getElementById('output').innerText = 'Generating AI startup...';

  const res = await fetch('http://localhost:3000/generate', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ topic })
  });

  const data = await res.json();

  document.getElementById('output').innerText = JSON.stringify(data, null, 2);
}
</script>
</body>
</html>
